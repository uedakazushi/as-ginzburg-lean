name: Lean build and axiom audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install elan and pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          exec > >(tee work/toolchain-setup.log) 2>&1
          started=$(date --utc --iso-8601=ns)
          setup_start_tick=$(python3 -c 'import time; print(time.monotonic_ns())')
          printf 'started_at_utc=%s\n' "$started"
          finish_setup() {
            setup_exit_code=$?
            printf 'ended_at_utc=%s\nexit_code=%s\n' "$(date --utc --iso-8601=ns)" "$setup_exit_code"
            python3 -c 'import sys,time; print("elapsed_seconds=%.9f" % ((time.monotonic_ns()-int(sys.argv[1]))/1e9))' "$setup_start_tick"
          }
          trap finish_setup EXIT
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o work/elan-init.sh
          bash work/elan-init.sh -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install leanprover/lean4:v4.24.0
          lean --version
      - name: Fresh build and exhaustive axiom audit
        id: verify
        run: bash scripts/check.sh --prepare-cache
      - name: Save this run's logs, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.verify.outputs.run_dir }}
            work/toolchain-setup.log
          if-no-files-found: error
          retention-days: 30
